<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}FixTrail{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dfe3ea;
      --accent: #2f5bd3; --accent-text: #ffffff;
      --ok-bg: #e3f4e8; --ok: #1d6b38; --warn-bg: #fdf1dc; --warn: #8a5200;
      --info-bg: #e8ecfb; --info: #2d438f; --bad-bg: #fbe4e4; --bad: #9b2222;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b2; --line: #2c3340;
        --accent: #7d9cff; --accent-text: #0f1320;
        --ok-bg: #173323; --ok: #8ad7a3; --warn-bg: #3a2c12; --warn: #f2c27a;
        --info-bg: #1f2747; --info: #a9b8f5; --bad-bg: #3d1c1c; --bad: #f4a3a3;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
                   gap: 6px 16px; padding-top: 12px; padding-bottom: 12px; }
    .brand { font-weight: 700; font-size: 1.15rem; color: var(--text); text-decoration: none; }
    .brand span { color: var(--accent); }
    nav { display: flex; flex-wrap: wrap; gap: 4px 16px; }
    nav a { color: var(--muted); text-decoration: none; font-size: .95rem; white-space: nowrap; }
    nav a:hover { color: var(--text); }
    .wrap { max-width: 780px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
    main { padding-top: 24px; padding-bottom: 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 28px 0 12px; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    .small { font-size: .875rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    a.card { display: block; color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--accent); }
    img, input, textarea { max-width: 100%; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
    .b-verified, .b-closed { background: var(--ok-bg); color: var(--ok); }
    .b-tenant_reported, .b-open, .b-disputed { background: var(--warn-bg); color: var(--warn); }
    .b-landlord_reported, .b-acknowledged, .b-scheduled, .b-landlord_marked_fixed { background: var(--info-bg); color: var(--info); }
    .b-disputed { background: var(--bad-bg); color: var(--bad); }
    .notice { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; }
    .notice.ok { background: var(--ok-bg); color: var(--ok); }
    .notice.bad { background: var(--bad-bg); color: var(--bad); }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { border-left: 3px solid var(--line); padding: 0 0 18px 16px; position: relative; }
    .timeline li::before { content: ""; position: absolute; left: -8px; top: 4px; width: 13px; height: 13px;
                           border-radius: 50%; background: var(--card); border: 3px solid var(--accent); }
    .timeline .meta { font-size: .85rem; color: var(--muted); }
    .timeline img { display: block; max-width: 100%; max-height: 260px; border-radius: 8px; margin-top: 8px; border: 1px solid var(--line); }
    details { margin-top: 6px; font-size: .82rem; color: var(--muted); }
    details code { word-break: break-all; }
    code { font-family: ui-monospace, Consolas, monospace; font-size: .85em; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], input[type=password], input[type=date], input[type=time], textarea {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; }
    textarea { min-height: 80px; }
    button, .button { display: inline-block; min-height: 44px; padding: 10px 18px; font: inherit; font-weight: 600;
      border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
      cursor: pointer; text-decoration: none; }
    button.secondary, .button.secondary { background: transparent; color: var(--accent); }
    .actions { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-bottom: 12px; }
    .actions form { margin: 0; display: flex; flex-direction: column; }
    .actions form button { margin-top: auto; }
    .actions button { width: 100%; }
    .big { font-size: 1.3rem; font-weight: 700; }
    footer { color: var(--muted); font-size: .8rem; padding: 24px 0; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/">Fix<span>Trail</span></a>
      <nav>{% block nav %}<a href="/">Issues</a><a href="/simulator">Simulator</a><a href="/verify">Verify record</a>{% endblock %}</nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap">
    FixTrail is a record-keeping tool, not legal advice. Times are server time (UTC).
  </footer>
</body>
</html>
